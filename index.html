<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="manifest" href="/revisions-ifsi/manifest.json">
    <meta name="theme-color" content="#3498db">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moteur Révisions IFSI</title>
    <style>
        /* --- STYLES GLOBAUX --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #2d3436;
            margin: 0;
            padding: 15px;
            line-height: 1.6; /* Meilleure interligne */
            font-size: 16px; /* Base augmentée */
        }

        .container {
            background-color: white;
            max-width: 900px; /* Un peu plus large */
            margin: 0 auto;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            min-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 1.8rem; /* Plus gros */
            margin: 0 0 25px 0;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* --- FILTRES (TAGS) --- */
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f1f2f6;
        }

        .filter-btn {
            background-color: #fff;
            border: 1px solid #dfe6e9;
            color: #636e72;
            padding: 10px 20px; /* Plus d'espace clickable */
            border-radius: 25px;
            font-size: 0.95rem; /* Texte plus gros */
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background-color: #f1f2f6;
            border-color: #b2bec3;
        }

        .filter-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.25);
        }

        /* --- GRILLE CARTES --- */
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); /* Cartes plus larges */
            gap: 20px;
            margin-bottom: 40px;
        }

        .quiz-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 25px; /* Padding interne augmenté */
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            
            /* MAGIE DE L'ALIGNEMENT */
            display: flex;
            flex-direction: column; 
            height: 100%; /* Force la hauteur égale dans la grille */
            min-height: 160px; /* Hauteur minimale confortable */
        }

        .quiz-card:hover {
            transform: translateY(-4px);
            border-color: #cbd5e0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .quiz-card.selected {
            border-color: #3498db;
            background-color: #f0f9ff;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        /* En-tête de carte (Badge + Icône) */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .card-badge {
            display: inline-block;
            background-color: #eaf6fd;
            color: #3498db;
            font-size: 0.8rem; /* + gros */
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .card-icon {
            font-size: 1.8rem; /* Emoji plus visible */
            line-height: 1;
        }

        .card-title {
            font-weight: 700;
            font-size: 1.25rem; /* Titre bien lisible */
            color: #2d3748;
            line-height: 1.3;
            margin-bottom: 10px;
            
            /* ALIGNEMENT : Le titre pousse le sous-titre vers le bas */
            flex-grow: 1; 
        }
        
        .card-subtitle {
            font-size: 0.95rem; /* Sous-titre lisible */
            color: #718096;
            margin-top: auto; /* Sécurité pour coller au bas si besoin */
        }

        /* SELECTEUR QUANTITE */
        .count-selector-container { text-align: center; margin-bottom: 30px; }
        
        .section-label {
            font-weight: 700; color: #b2bec3; margin-bottom: 15px;
            display: block; text-transform: uppercase; font-size: 0.8rem;
            letter-spacing: 1px; text-align: center;
        }

        .count-options { display: inline-flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        .count-pill {
            padding: 10px 24px; background-color: #edf2f7; border-radius: 50px;
            cursor: pointer; font-weight: 600; color: #718096; transition: all 0.2s;
            border: 2px solid transparent; font-size: 1rem; /* Texte bouton + gros */
        }

        .count-pill:hover { background-color: #e2e8f0; }
        .count-pill.selected {
            background-color: #3498db; color: white;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
            border-color: #3498db;
        }

        /* BOUTON LANCER */
        .start-btn {
            background-color: #2c3e50; color: white; padding: 18px 40px;
            border-radius: 14px; cursor: pointer; font-weight: 700; border: none;
            font-size: 1.1rem; /* + gros */
            transition: all 0.3s; width: 100%; display: block;
            margin: 0 auto; opacity: 0.5; pointer-events: none;
        }

        .start-btn.ready {
            background-color: #3498db; opacity: 1; pointer-events: auto;
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.25);
        }
        .start-btn.ready:hover { transform: translateY(-2px); background-color: #2980b9; }

        /* --- UI QUIZ --- */
        .quiz-context-header {
            text-align: center; margin-bottom: 25px; padding-bottom: 20px;
            border-bottom: 1px solid #edf2f7;
        }
        .context-title { font-weight: 800; color: #3498db; font-size: 1rem; text-transform: uppercase; }
        .context-subtitle { color: #718096; font-size: 0.95rem; margin-top: 5px; }

        .progress {
            text-align: right; color: #cbd5e0; font-weight: 700;
            font-size: 0.9rem; margin-bottom: 15px;
        }

        .question-box { display: none; animation: fadeIn 0.3s ease-out; }
        .question-box.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .question-title {
            font-size: 1.3rem; /* Enoncé + gros */
            font-weight: 700; margin-bottom: 25px;
            color: #2d3748; line-height: 1.4;
        }

        .hint-text {
            display: inline-block; background: #ebf8ff; color: #3182ce;
            padding: 6px 12px; border-radius: 6px; font-size: 0.85rem;
            font-weight: 700; margin-bottom: 25px;
        }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .options label {
            display: flex; align-items: center; padding: 18px 20px; /* Plus d'espace tactile */
            background-color: #fff; border: 2px solid #edf2f7;
            border-radius: 12px; cursor: pointer; transition: all 0.15s ease;
            font-size: 1.05rem; /* Options + lisibles */
            color: #4a5568;
        }

        .options label:hover { border-color: #cbd5e0; }
        .options label:active { transform: scale(0.99); background-color: #f7fafc; }

        .options input[type="checkbox"], .options input[type="radio"] {
            appearance: none; width: 24px; height: 24px; /* Checkbox + grosses */
            border: 2px solid #cbd5e0; border-radius: 6px; margin-right: 18px;
            display: grid; place-content: center; flex-shrink: 0; transition: 0.2s;
        }
        .options input[type="radio"] { border-radius: 50%; }
        .options input:checked { border-color: #3498db; background-color: #3498db; }
        
        .options input:checked::before {
            content: ""; width: 10px; height: 10px; background: white;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .options input[type="radio"]:checked::before { clip-path: circle(50%); }

        /* Validation Colors */
        .options label.correct-checked { background-color: #f0fff4; border-color: #48bb78; color: #22543d; }
        .options label.correct-checked input { background-color: #48bb78; border-color: #48bb78; }
        
        .options label.wrong-checked { background-color: #fff5f5; border-color: #f56565; color: #742a2a; }
        .options label.wrong-checked input { background-color: #f56565; border-color: #f56565; }

        .options label.missed-correct { border-color: #48bb78; background-color: #fff; border-style: dashed; }
        .options label.neutral-disabled { opacity: 0.5; pointer-events: none; }

        .btn {
            background-color: #3498db; color: white; border: none; padding: 18px;
            font-size: 1.1rem; border-radius: 12px; cursor: pointer; margin-top: 30px;
            width: 100%; font-weight: 700; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
        }
        .btn-next { background-color: #2d3748; box-shadow: none; }

        .feedback-text {
            margin-top: 25px; padding: 20px; background-color: #fffaf0;
            border-left: 5px solid #ed8936; border-radius: 8px;
            font-size: 1rem; color: #9c4221; display: none;
        }

        /* Resultats */
        #result-screen { display: none; text-align: center; padding: 20px 0; }
        .score-circle {
            width: 140px; height: 140px; background: white;
            border: 8px solid #3498db;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #3498db; font-size: 3rem; font-weight: 800; margin: 30px auto;
        }
        .time-stat { color: #a0aec0; font-size: 1rem; margin-top: -10px; margin-bottom: 30px; }

        @media (max-width: 600px) {
            .container { padding: 20px; border-radius: 0; box-shadow: none; min-height: 100vh; }
            .quiz-grid { grid-template-columns: 1fr; }
            .filter-container { overflow-x: auto; white-space: nowrap; justify-content: flex-start; padding-bottom: 10px; }
            /* Ajustements mobiles pour ne pas que ce soit énorme */
            h1 { font-size: 1.4rem; }
            .quiz-card { min-height: auto; } /* Sur mobile, on laisse la hauteur auto */
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="header-area">
            <h1 id="app-title">🎓 RÉVISIONS IFSI</h1>
        </div>

        <div id="setup-panel">
            <div id="loading-spinner" style="text-align:center; padding:20px; color:#a0aec0; font-size:1rem;">
                Chargement...
            </div>

            <div id="grid-section" style="display:none;">
                
                <div id="filters" class="filter-container"></div>

                <div id="quiz-grid" class="quiz-grid"></div>

                <div class="count-selector-container">
                    <span class="section-label">Nombre de questions</span>
                    <div class="count-options">
                        <div class="count-pill" onclick="selectCount(5, this)">5</div>
                        <div class="count-pill selected" onclick="selectCount(10, this)">10</div>
                        <div class="count-pill" onclick="selectCount(20, this)">20</div>
                        <div class="count-pill" onclick="selectCount('all', this)">Tout</div>
                    </div>
                </div>

                <button id="load-btn" class="start-btn" onclick="loadSelectedQuiz()">
                    Commencer
                </button>
            </div>

            <div id="error-msg" style="color:#e53e3e; margin-top:20px; text-align:center; display:none; font-weight:bold;"></div>
        </div>

        <div id="quiz-interface" style="display:none;">
            <div class="quiz-context-header">
                <div class="context-title" id="ctx-title">UE --</div>
                <div class="context-subtitle" id="ctx-sub">Sujet</div>
            </div>

            <div class="progress" id="progress"></div>
            <div id="quiz-container"></div>
        </div>

        <div id="result-screen">
            <h2>Terminé !</h2>
            <div class="score-circle" id="final-score">0/0</div>
            <div class="time-stat" id="final-time">-- min -- s</div>
            <h3 id="comment" style="margin-bottom: 10px;"></h3>
            <p id="detail-msg" style="color: #718096; margin-bottom:30px; font-size:1.1rem;"></p>

            <button id="continue-btn" class="btn btn-next" style="display:none;" onclick="startSession()">Continuer la suite</button>
            <button class="btn" onclick="restartSameSession()">Refaire cette série</button>
            <button class="btn" style="background-color:#cbd5e0; color:#4a5568; margin-top:15px;" onclick="location.reload()">Changer de sujet</button>
        </div>
    </div>

    <script>
        // --- VARIABLES ---
        let sessionSize = 10;
        let selectedQuizUrl = null; 
        
        let currentQuizName = "";
        let currentQuizSub = "";

        let fullQuestionPool = [];
        let remainingQuestions = [];
        let currentSession = [];
        let lastSession = [];
        let lastSessionRemainingSnapshot = [];
        let currentIndex = 0;
        let score = 0;
        let startTime = 0;

        // --- CHARGEMENT ---
        window.onload = function () {
            fetch('quizzes.json', { cache: 'no-store' })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading-spinner').style.display = 'none';
                    document.getElementById('grid-section').style.display = 'block';
                    generateFilters(data);
                    renderGrid(data);
                })
                .catch(err => {
                    document.getElementById('loading-spinner').style.display = 'none';
                    document.getElementById('error-msg').style.display = 'block';
                    document.getElementById('error-msg').innerText = "Erreur : " + err.message;
                });
        };

        // --- GESTION FILTRES ---
        function generateFilters(data) {
            const filterContainer = document.getElementById('filters');
            const codes = [...new Set(data.map(q => q.code || "AUTRE"))].sort();
            
            let allBtn = document.createElement('div');
            allBtn.className = "filter-btn active";
            allBtn.innerText = "TOUT";
            allBtn.onclick = () => filterGrid('ALL', allBtn);
            filterContainer.appendChild(allBtn);

            codes.forEach(code => {
                let btn = document.createElement('div');
                btn.className = "filter-btn";
                btn.innerText = code;
                btn.onclick = () => filterGrid(code, btn);
                filterContainer.appendChild(btn);
            });
        }

        function filterGrid(category, clickedBtn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            clickedBtn.classList.add('active');

            const cards = document.querySelectorAll('.quiz-card');
            cards.forEach(card => {
                const cardCode = card.dataset.code || "AUTRE";
                if (category === 'ALL' || cardCode === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // --- RENDU GRILLE ---
        function renderGrid(data) {
            const grid = document.getElementById('quiz-grid');
            grid.innerHTML = ""; 

            data.forEach(q => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                const codeUE = q.code ? q.code : "AUTRE";
                const icon = q.icon ? q.icon : ""; 

                card.dataset.code = codeUE;

                card.onclick = () => selectQuiz(q.file, card, q.name, q.subtitle, codeUE);
                
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-badge">${codeUE}</span>
                        <span class="card-icon">${icon}</span>
                    </div>
                    <span class="card-title">${q.name}</span>
                    <span class="card-subtitle">${q.subtitle || ""}</span>
                `;
                grid.appendChild(card);
            });
        }

        // --- SELECTION & JEU ---
        function selectQuiz(url, element, name, sub, code) {
            document.querySelectorAll('.quiz-card').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedQuizUrl = url;
            currentQuizName = (code && code !== "AUTRE" ? code + " • " : "") + name;
            currentQuizSub = sub || "";
            checkReadyState();
        }

        function selectCount(value, element) {
            document.querySelectorAll('.count-pill').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            sessionSize = (value === "all") ? Infinity : parseInt(value, 10);
        }

        function checkReadyState() {
            const btn = document.getElementById('load-btn');
            if (selectedQuizUrl) btn.classList.add('ready');
            else btn.classList.remove('ready');
        }

        function loadSelectedQuiz() {
            if (!selectedQuizUrl) return; 
            const btn = document.getElementById('load-btn');
            btn.innerText = "Chargement...";
            
            fetch(selectedQuizUrl, { cache: 'no-store' })
                .then(res => res.json())
                .then(data => {
                    if (!data.questions) throw new Error("JSON invalide");
                    fullQuestionPool = data.questions;
                    remainingQuestions = shuffle([...fullQuestionPool]);
                    
                    document.getElementById('setup-panel').style.display = 'none';
                    document.getElementById('header-area').style.display = 'none';
                    document.getElementById('quiz-interface').style.display = 'block';
                    document.getElementById('ctx-title').innerText = currentQuizName;
                    document.getElementById('ctx-sub').innerText = currentQuizSub;
                    
                    startSession();
                })
                .catch(err => {
                    document.getElementById('error-msg').style.display = 'block';
                    document.getElementById('error-msg').innerText = err.message;
                    btn.innerText = "Commencer";
                });
        }

        // --- MOTEUR ---
        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

        function startSession() {
            document.getElementById('quiz-interface').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';

            if (!remainingQuestions || remainingQuestions.length === 0) remainingQuestions = shuffle([...fullQuestionPool]);
            const n = (sessionSize === Infinity) ? remainingQuestions.length : Math.min(sessionSize, remainingQuestions.length);
            
            currentSession = remainingQuestions.slice(0, n);
            remainingQuestions = remainingQuestions.slice(n);
            lastSession = currentSession;
            lastSessionRemainingSnapshot = remainingQuestions;
            currentIndex = 0; score = 0; startTime = new Date();

            document.getElementById('quiz-container').innerHTML = '';
            showQuestion();
        }

        function restartSameSession() {
            document.getElementById('quiz-interface').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';

            if (!lastSession.length) { startSession(); return; }
            currentSession = lastSession;
            remainingQuestions = lastSessionRemainingSnapshot;
            currentIndex = 0; score = 0; startTime = new Date();
            
            document.getElementById('quiz-container').innerHTML = '';
            showQuestion();
        }

        function showQuestion() {
            const q = currentSession[currentIndex];
            const container = document.getElementById('quiz-container');
            document.getElementById('progress').innerText = `${currentIndex + 1} / ${currentSession.length}`;
            const isVF = q.options.length === 2 && q.options.some(o => o.toLowerCase().includes("vrai"));
            let inputType = isVF ? 'radio' : 'checkbox';
            let hint = isVF ? "Vrai ou Faux" : "Plusieurs réponses possibles";
            let optionsWithIndex = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
            if (!isVF) optionsWithIndex = shuffle(optionsWithIndex);

            let html = `
            <div class="question-box active">
                <div class="question-title">${q.question}</div>
                <div class="hint-text">${hint}</div>
                <div class="options">
                    ${optionsWithIndex.map((opt, i) => `
                        <label id="opt-${i}">
                            <input type="${inputType}" name="option" value="${opt.originalIndex}">
                            <span>${opt.text}</span>
                        </label>
                    `).join('')}
                </div>
                <button id="validate-btn" class="btn" onclick="validate()">Valider</button>
                <div class="feedback-text" id="feedback"></div>
            </div>`;
            container.innerHTML = html;
        }

        window.validate = function () {
            const q = currentSession[currentIndex];
            const allInputs = document.querySelectorAll('input[name="option"]');
            const checkedInputs = document.querySelectorAll('input[name="option"]:checked');
            if (checkedInputs.length === 0) return alert("Une réponse est requise");
            document.getElementById('validate-btn').style.display = 'none';
            allInputs.forEach(i => i.disabled = true);
            const checkedValues = Array.from(checkedInputs).map(cb => parseInt(cb.value));
            const isCorrect = JSON.stringify(q.correct.sort()) === JSON.stringify(checkedValues.sort());
            if (isCorrect) score++;

            allInputs.forEach((input, domIndex) => {
                const val = parseInt(input.value);
                const label = document.getElementById(`opt-${domIndex}`);
                if (!label) return;
                if (q.correct.includes(val)) input.checked ? label.classList.add('correct-checked') : label.classList.add('missed-correct');
                else input.checked ? label.classList.add('wrong-checked') : label.classList.add('neutral-disabled');
            });

            const nextText = currentIndex === currentSession.length - 1 ? "Voir les résultats" : "Suivant";
            let explanation = (q.explanation && q.explanation.trim() !== "") 
                ? `<div style="margin-top:10px; font-weight:400; color:#2d3748; line-height:1.5;">${q.explanation}</div>` : "";
            const fb = document.getElementById('feedback');
            fb.style.display = 'block';
            fb.innerHTML = `<strong>${isCorrect ? "BRAVO ! 🎉" : "DOMMAGE..."}</strong>${explanation}<button class="btn btn-next" onclick="nextQuestion()">${nextText}</button>`;
            fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };

        window.nextQuestion = function () {
            if (currentIndex < currentSession.length - 1) { currentIndex++; showQuestion(); } else { endQuiz(); }
        };

        function endQuiz() {
            const timeDiff = Math.floor((new Date() - startTime) / 1000);
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            document.getElementById('quiz-interface').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerText = `${score}/${currentSession.length}`;
            document.getElementById('final-time').innerText = `${minutes}m ${seconds}s`;
            const ratio = score / currentSession.length;
            const comment = document.getElementById('comment');
            if (ratio >= 0.8) { comment.innerText = "Excellent ! 🏆"; comment.style.color = "#48bb78"; }
            else if (ratio >= 0.5) { comment.innerText = "Bien joué ! 👍"; comment.style.color = "#ed8936"; }
            else { comment.innerText = "Courage ! 💪"; comment.style.color = "#e53e3e"; }
            
            const contBtn = document.getElementById('continue-btn');
            if (remainingQuestions.length > 0 && sessionSize !== Infinity) {
                contBtn.style.display = 'block';
                contBtn.innerText = `Continuer (${Math.min(sessionSize, remainingQuestions.length)} questions)`;
            } else { contBtn.style.display = 'none'; }
        }
        
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => { navigator.serviceWorker.register("/revisions-ifsi/sw.js"); });
        }
    </script>
</body>
</html>
