<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="manifest" href="/revisions-ifsi/manifest.json">
    <meta name="theme-color" content="#3498db">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moteur Révisions IFSI</title>
    <style>
        /* --- STYLES GLOBAUX --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #2d3436;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            font-size: 16px;
        }

        .container {
            background-color: white;
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 20px clamp(16px, 2.5vw, 36px);
            display: flex;
            flex-direction: column;
        }

        #header-area,
        #setup-panel {
            width: 100%;
            max-width: 1440px;
            margin-inline: auto;
        }

        #quiz-interface,
        #result-screen {
            width: min(100%, 820px);
            margin-inline: auto;
        }

        h1 {
            color: #2c3e50;
            text-align: left;
            font-size: 1.55rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .year-switch {
            display: none;
            border: 1px solid #dfe6e9;
            background: #fff;
            color: #4a5568;
            border-radius: 999px;
            padding: 7px 12px;
            font: inherit;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .year-switch:hover { background: #f7fafc; border-color: #b9c7d3; }

        .year-gate {
            min-height: 62vh;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .year-gate-card {
            width: min(100%, 520px);
            padding: 28px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            background: #f8fbfd;
        }

        .year-gate-card h2 { margin: 0 0 6px; color: #2c3e50; }
        .year-gate-card p { margin: 0 0 20px; color: #718096; }
        .year-choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .year-choice {
            border: 2px solid #d9e5ed;
            background: #fff;
            color: #2c3e50;
            border-radius: 14px;
            padding: 18px 12px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .year-choice:hover { border-color: #3498db; color: #2980b9; transform: translateY(-1px); }

        .semester-container {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 2px 10px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }
        .semester-container::-webkit-scrollbar { display: none; }
        .semester-label {
            color: #a0aec0;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-right: 3px;
            white-space: nowrap;
        }

        /* --- FILTRES --- */
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 10px;
            padding-left: 5px; padding-right: 5px;
            margin-bottom: 10px;
            border-bottom: 1px solid #f1f2f6;
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch;
        }
        .filter-container::-webkit-scrollbar { display: none; }

        .filter-btn {
            background-color: #fff;
            border: 1px solid #dfe6e9;
            color: #636e72;
            padding: 7px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .filter-btn:hover { background-color: #f1f2f6; border-color: #b2bec3; }

        .filter-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.25);
        }

        /* --- CARROUSEL --- */
        .category-section {
            margin-bottom: 10px;
            animation: fadeInSection 0.3s ease-out;
        }

        #carousels-container.synthesis-only {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 20px;
        }

        #carousels-container.synthesis-only .category-section {
            margin-bottom: 0;
        }

        #carousels-container.synthesis-only .horizontal-scroll {
            overflow: visible;
            padding-bottom: 10px;
        }
        @keyframes fadeInSection {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SCROLL HORIZONTAL */
        .horizontal-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 8px 6px 14px;
            scroll-padding-inline: 6px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        
        .horizontal-scroll::-webkit-scrollbar { height: 8px; }
        .horizontal-scroll::-webkit-scrollbar-track { background: #f1f2f6; border-radius: 4px; margin: 0 10px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #bdc3c7; border-radius: 4px; }
        .horizontal-scroll::-webkit-scrollbar-thumb:hover { background: #95a5a6; }

        /* --- CARTE DESIGN --- */
        .quiz-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative; 
            overflow: hidden;   
            flex: 0 0 clamp(220px, calc((100% - 36px) / 4), 245px);
            min-width: 0;
            max-width: 245px;
            height: 176px;
            scroll-snap-align: start;
            scroll-margin-inline: 6px;
            scroll-margin-block: 12px 100px;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
            border-color: #cbd5e0;
            box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        }

        .quiz-card.selected {
            border-color: #3498db;
            background-color: #f0f9ff;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .quiz-card.synthesis-card {
            background: linear-gradient(145deg, #ffffff 35%, #f2f8fd 100%);
            border-color: #b9d8ee;
            box-shadow: 0 6px 18px rgba(52, 152, 219, 0.08);
        }

        .quiz-card.synthesis-card:hover {
            border-color: #7fb9df;
            box-shadow: 0 12px 26px rgba(52, 152, 219, 0.14);
        }

        .quiz-card.synthesis-card.selected {
            background: #f0f9ff;
            border-color: #3498db;
        }

        .quiz-card.synthesis-card .card-bg-icon {
            opacity: 0.13;
            filter: none;
        }

        .quiz-card.synthesis-card .card-title {
            color: #245b7d;
        }

        .card-bg-icon {
            position: absolute;
            bottom: -15px;
            right: -10px;
            font-size: 6rem; 
            opacity: 0.08;   
            line-height: 1;
            z-index: 0;      
            pointer-events: none;
            filter: grayscale(100%); 
            transform: rotate(-10deg);
        }

        .card-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* --- LIGNE DES BADGES --- */
        .card-top-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            min-height: 24px;
        }

        .card-badge {
            background-color: #eaf6fd;
            color: #3498db;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.2;
            display: inline-flex;
            align-items: center;
        }

        .card-count {
            background-color: #f7fafc;
            color: #95a5a6;
            border: 1px solid #edf2f7;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 6px;
            opacity: 0; 
            transition: opacity 0.3s ease;
            margin: 0;
            line-height: 1.2;
            display: inline-flex;
            align-items: center;
        }

        .card-title {
            font-weight: 800;
            font-size: 1rem;
            color: #2d3748;
            line-height: 1.3;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .card-subtitle { 
            font-size: 0.9rem; 
            color: #718096; 
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: normal;
            margin-top: auto;
        }

        /* BARRE DE LANCEMENT */
        #grid-section { padding-bottom: 96px; }

        .launch-dock {
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: max(10px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: min(calc(100% - 24px), 1400px);
            display: none;
            align-items: center;
            gap: 14px;
            padding: 10px 12px;
            border: 1px solid rgba(203, 213, 224, 0.9);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 12px 35px rgba(45, 55, 72, 0.18);
            backdrop-filter: blur(12px);
        }

        .dock-selection {
            min-width: 0;
            flex: 1;
            color: #718096;
            font-size: 0.84rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .count-options { display: inline-flex; gap: 6px; justify-content: center; flex-shrink: 0; }

        .count-pill {
            padding: 7px 13px; background-color: #edf2f7; border-radius: 50px;
            cursor: pointer; font-weight: 600; color: #718096; transition: all 0.2s;
            border: 2px solid transparent; font-size: 0.88rem; font-family: inherit;
        }

        .count-pill:hover { background-color: #e2e8f0; }
        .count-pill.selected {
            background-color: #3498db; color: white;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.25);
            border-color: #3498db;
        }

        .start-btn {
            background-color: #2c3e50; color: white; padding: 11px 22px;
            border-radius: 12px; cursor: pointer; font-weight: 700; border: none;
            font-size: 0.98rem; transition: all 0.3s; width: auto; min-width: 150px;
            margin: 0; opacity: 0.5; pointer-events: none;
        }

        .start-btn.ready {
            background-color: #3498db; opacity: 1; pointer-events: auto;
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.25);
        }
        .start-btn.ready:hover { transform: translateY(-2px); background-color: #2980b9; }

        /* --- UI QUIZ --- */
        .quiz-context-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            text-align: left;
            margin-bottom: 14px;
            padding: 2px 0 10px;
            border-bottom: 1px solid #edf2f7;
        }
        .quiz-context-copy { min-width: 0; }
        .context-title {
            overflow: hidden;
            color: #3498db;
            font-size: 0.88rem;
            font-weight: 800;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .context-subtitle {
            overflow: hidden;
            color: #718096;
            font-size: 0.8rem;
            margin-top: 1px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress {
            flex-shrink: 0;
            padding: 4px 9px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #718096;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .question-box { display: none; animation: fadeIn 0.3s ease-out; }
        .question-box.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .question-title {
            color: #2d3748;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 12px;
        }

        .hint-text {
            display: inline-block; background: #ebf8ff; color: #3182ce;
            padding: 5px 10px; border-radius: 6px; font-size: 0.8rem;
            font-weight: 700; margin-bottom: 12px;
        }

        .options { display: flex; flex-direction: column; gap: 8px; }

        .options label {
            display: flex; align-items: flex-start;
            padding: 13px 14px;
            background-color: #fff; border: 2px solid #edf2f7;
            border-radius: 12px; cursor: pointer; transition: all 0.15s ease;
            font-size: 1rem; color: #4a5568;
        }

        .options label span { margin-top: 1px; }

        .options label:hover { border-color: #cbd5e0; }
        .options label:active { transform: scale(0.99); background-color: #f7fafc; }

        .options input[type="checkbox"], .options input[type="radio"] {
            appearance: none; width: 22px; height: 22px;
            border: 2px solid #cbd5e0; border-radius: 6px; margin-right: 15px;
            display: grid; place-content: center; flex-shrink: 0; transition: 0.2s;
            margin-top: 3px;
        }
        .options input[type="radio"] { border-radius: 50%; }
        .options input:checked { border-color: #3498db; background-color: #3498db; }
        
        .options input:checked::before {
            content: ""; width: 9px; height: 9px; background: white;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .options input[type="radio"]:checked::before { clip-path: circle(50%); }

        .options label.correct-checked { background-color: #f0fff4; border-color: #48bb78; color: #22543d; }
        .options label.correct-checked input { background-color: #48bb78; border-color: #48bb78; }
        .options label.wrong-checked { background-color: #fff5f5; border-color: #f56565; color: #742a2a; }
        .options label.wrong-checked input { background-color: #f56565; border-color: #f56565; }
        .options label.missed-correct { border-color: #48bb78; background-color: #fff; border-style: dashed; }
        .options label.neutral-disabled { opacity: 0.5; pointer-events: none; }

        .btn {
            background-color: #3498db; color: white; border: none; padding: 16px;
            font-size: 1.05rem; border-radius: 12px; cursor: pointer; margin-top: 18px;
            width: 100%; font-weight: 700; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
        }
        .btn-next { background-color: #2d3748; box-shadow: none; }

        .feedback-text {
            margin-top: 20px; padding: 15px; background-color: #fffaf0;
            border-left: 5px solid #ed8936; border-radius: 8px;
            font-size: 0.95rem; color: #9c4221; display: none;
        }
        
        /* STYLE BOUTON MASQUER */
        .ban-btn {
            display: block; margin: 25px auto 0 auto;
            background-color: transparent;
            border: 1px solid #bdc3c7;
            color: #95a5a6;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: auto;
        }
        .ban-btn:hover { border-color: #7f8c8d; color: #7f8c8d; background-color: #f8f9fa; }

        /* FOOTER RESET */
        .footer-reset {
            margin-top: 8px; text-align: center;
            border-top: 1px solid #f1f2f6; padding-top: 10px;
            display: flex; justify-content: center;
        }
        .reset-link { color: #b2bec3; font-size: 0.76rem; text-decoration: none; cursor: pointer; background: none; border: 0; font-family: inherit; }
        .reset-link:hover { text-decoration: underline; color: #636e72; }

        /* Resultats */
        #result-screen { display: none; text-align: center; padding: 10px 0; }
        .score-circle {
            width: 110px; height: 110px; background: white;
            border: 6px solid #3498db;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #3498db; font-size: 2.2rem; font-weight: 800; margin: 20px auto;
        }
        .time-stat { color: #a0aec0; font-size: 1rem; margin-top: -15px; margin-bottom: 25px; }
        
        #detail-msg { font-size: 0.95rem; color: #7f8c8d; margin-bottom: 20px; font-weight: 500; }

        /* --- OPTIMISATION MOBILE --- */
        @media (max-width: 600px) {
            .container { padding: 12px; min-height: 100vh; }
            .app-header { margin-bottom: 10px; }
            h1 { font-size: 1.25rem; }
            .year-switch { padding: 6px 9px; font-size: 0.76rem; }
            .year-gate-card { padding: 22px 16px; }
            
            .quiz-context-header { margin-bottom: 10px; padding-bottom: 8px; }
            .context-title { font-size: 0.8rem; }
            .context-subtitle { font-size: 0.75rem; }
            .progress { padding: 4px 8px; font-size: 0.72rem; }
            .question-title { font-size: 1.1rem; margin-bottom: 10px; }
            .hint-text { margin-bottom: 10px; }
            .options label { padding: 12px; font-size: 0.94rem; }
            
            .horizontal-scroll::-webkit-scrollbar { display: none; }
            .horizontal-scroll { scrollbar-width: none; }
            
            .quiz-card {
                flex-basis: calc(100% - 20px);
                min-width: 0;
                max-width: 300px;
                height: 164px;
                padding: 14px;
            }
            
            .card-badge { margin: 0; }
            .card-title { font-size: 1rem; -webkit-line-clamp: 3; }
            .card-subtitle { font-size: 0.82rem; -webkit-line-clamp: 3; }
            .card-bg-icon { font-size: 5rem; bottom: -10px; right: -8px; }
            
            .category-section { margin-bottom: 8px; }
            #grid-section { padding-bottom: 94px; }
            .launch-dock {
                width: calc(100% - 16px);
                bottom: max(6px, env(safe-area-inset-bottom));
                gap: 8px;
                padding: 8px;
                border-radius: 14px;
            }
            .dock-selection { display: none; }
            .count-options { gap: 3px; flex: 1; }
            .count-pill { padding: 6px 9px; font-size: 0.8rem; flex: 1; }
            .start-btn { min-width: 104px; padding: 10px 12px; font-size: 0.9rem; }
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="header-area">
            <div class="app-header">
                <h1 id="app-title">🎓 RÉVISIONS IFSI</h1>
                <button id="year-switch" class="year-switch" type="button" onclick="showYearGate()">Changer d'année</button>
            </div>
        </div>

        <div id="setup-panel">
            <div id="loading-spinner" style="text-align:center; padding:20px; color:#a0aec0; font-size:1rem;">
                Chargement...
            </div>

            <div id="year-gate" class="year-gate">
                <div class="year-gate-card">
                    <h2>Quelle est ton année d'étude ?</h2>
                    <p>Tu pourras la modifier à tout moment.</p>
                    <div id="year-choices" class="year-choices"></div>
                </div>
            </div>

            <div id="grid-section" style="display:none;">
                <div id="semester-filters" class="semester-container"></div>
                <div id="filters" class="filter-container"></div>
                <div id="carousels-container"></div>

                <div class="footer-reset">
                    <button class="reset-link" type="button" onclick="resetBannedQuestions()">Réintégrer les questions masquées</button>
                </div>

                <div id="launch-dock" class="launch-dock">
                    <div id="dock-selection" class="dock-selection">Sélectionne un quiz</div>
                    <div class="count-options" aria-label="Nombre de questions">
                        <button type="button" class="count-pill" onclick="selectCount(5, this)">5</button>
                        <button type="button" class="count-pill selected" onclick="selectCount(10, this)">10</button>
                        <button type="button" class="count-pill" onclick="selectCount(20, this)">20</button>
                        <button type="button" class="count-pill" onclick="selectCount('all', this)">Tout</button>
                    </div>
                    <button id="load-btn" class="start-btn" type="button" onclick="loadSelectedQuiz()" disabled>
                        Commencer
                    </button>
                </div>
            </div>

            <div id="error-msg" style="color:#e53e3e; margin-top:20px; text-align:center; display:none; font-weight:bold;"></div>
        </div>

        <div id="quiz-interface" style="display:none;">
            <div class="quiz-context-header">
                <div class="quiz-context-copy">
                    <div class="context-title" id="ctx-title">UE --</div>
                    <div class="context-subtitle" id="ctx-sub">Sujet</div>
                </div>
                <div class="progress" id="progress"></div>
            </div>
            <div id="quiz-container"></div>
        </div>

        <div id="result-screen">
            <h2>Terminé !</h2>
            <div class="score-circle" id="final-score">0/0</div>
            <div class="time-stat" id="final-time">-- min -- s</div>
            <h3 id="comment" style="margin-bottom: 10px;"></h3>
            
            <p id="detail-msg"></p>

            <button id="continue-btn" class="btn btn-next" style="display:none;" onclick="startSession()">Continuer la suite</button>
            <button class="btn" onclick="restartSameSession()">Refaire cette série</button>
            <button class="btn" style="background-color:#cbd5e0; color:#4a5568; margin-top:15px;" onclick="location.reload()">Changer de sujet</button>
        </div>
    </div>

    <script>
        let sessionSize = 10;
        let selectedQuizUrl = null; 
        let currentQuizFile = null;
        let currentQuizName = "";
        let currentQuizSub = "";
        let fullQuestionPool = [];
        let remainingQuestions = [];
        let currentSession = [];
        let lastSession = [];
        let lastSessionRemainingSnapshot = [];
        let currentIndex = 0;
        let score = 0;
        let startTime = 0;
        let catalogData = [];
        let selectedYear = null;
        let selectedSemester = 'ALL';

        window.onload = function () {
            fetch('quizzes.json')
                .then(res => res.json())
                .then(data => {
                    catalogData = data;
                    document.getElementById('loading-spinner').style.display = 'none';
                    const years = [...new Set(data.map(getQuizYear))].sort();
                    renderYearChoices(years);

                    const savedYear = parseInt(localStorage.getItem('ifsi_study_year_v1'), 10);
                    if (years.includes(savedYear)) selectStudyYear(savedYear);
                    else showYearGate();
                })
                .catch(err => {
                    document.getElementById('loading-spinner').style.display = 'none';
                    document.getElementById('error-msg').style.display = 'block';
                    document.getElementById('error-msg').innerText = "Erreur : " + err.message;
                });
        };

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/revisions-ifsi/sw.js");
            });
        }

        function getQuizYear(quiz) {
            return Number.isInteger(quiz.year) ? quiz.year : 3;
        }

        function getQuizSemesters(quiz) {
            if (Array.isArray(quiz.semesters)) return quiz.semesters;
            if (Number.isInteger(quiz.semester)) return [quiz.semester];
            return getQuizYear(quiz) === 3 ? [5] : [];
        }

        function yearLabel(year) {
            if (year === 1) return "1re année";
            return `${year}e année`;
        }

        function renderYearChoices(years) {
            const container = document.getElementById('year-choices');
            container.innerHTML = '';
            years.forEach(year => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'year-choice';
                button.textContent = yearLabel(year);
                button.onclick = () => selectStudyYear(year);
                container.appendChild(button);
            });
        }

        function showYearGate() {
            resetQuizSelection();
            document.getElementById('grid-section').style.display = 'none';
            document.getElementById('year-gate').style.display = 'flex';
            document.getElementById('year-switch').style.display = 'none';
            document.getElementById('launch-dock').style.display = 'none';
        }

        function selectStudyYear(year) {
            selectedYear = year;
            selectedSemester = 'ALL';
            localStorage.setItem('ifsi_study_year_v1', String(year));

            document.getElementById('year-gate').style.display = 'none';
            document.getElementById('grid-section').style.display = 'block';
            document.getElementById('year-switch').style.display = 'inline-flex';
            document.getElementById('year-switch').textContent = `${yearLabel(year)} ▾`;
            document.getElementById('launch-dock').style.display = 'flex';

            renderSemesterFilters();
            renderCatalogView();
        }

        function renderSemesterFilters() {
            const container = document.getElementById('semester-filters');
            const yearQuizzes = catalogData.filter(q => getQuizYear(q) === selectedYear);
            const semesters = [...new Set(yearQuizzes.flatMap(getQuizSemesters))].sort();
            container.innerHTML = '<span class="semester-label">Semestre</span>';

            const choices = [{ value: 'ALL', label: "Toute l'année" }, ...semesters.map(s => ({ value: s, label: `S${s}` }))];
            choices.forEach(choice => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `filter-btn semester-filter${choice.value === selectedSemester ? ' active' : ''}`;
                button.textContent = choice.label;
                button.onclick = () => {
                    selectedSemester = choice.value;
                    container.querySelectorAll('.semester-filter').forEach(item => item.classList.remove('active'));
                    button.classList.add('active');
                    renderCatalogView();
                };
                container.appendChild(button);
            });
        }

        function renderCatalogView() {
            resetQuizSelection();
            const filtered = catalogData.filter(quiz => {
                if (getQuizYear(quiz) !== selectedYear) return false;
                return selectedSemester === 'ALL' || getQuizSemesters(quiz).includes(selectedSemester);
            });
            document.getElementById('carousels-container').classList.remove('synthesis-only');
            generateFilters(filtered);
            renderCarousels(filtered);
        }

        function resetQuizSelection() {
            selectedQuizUrl = null;
            currentQuizFile = null;
            currentQuizName = '';
            currentQuizSub = '';
            const summary = document.getElementById('dock-selection');
            if (summary) summary.textContent = 'Sélectionne un quiz';
            checkReadyState();
        }

        function generateFilters(data) {
            const filterContainer = document.getElementById('filters');
            filterContainer.innerHTML = '';
            const codes = [...new Set(data.map(q => q.code || "AUTRE"))].sort();

            let allBtn = document.createElement('button');
            allBtn.type = 'button';
            allBtn.className = "filter-btn active";
            allBtn.innerText = "TOUT";
            allBtn.onclick = () => filterCarousels('ALL', allBtn);
            filterContainer.appendChild(allBtn);

            if (data.some(q => q.type === 'synthesis')) {
                const synthesisBtn = document.createElement('button');
                synthesisBtn.type = 'button';
                synthesisBtn.className = "filter-btn";
                synthesisBtn.innerText = "SYNTHÈSES";
                synthesisBtn.onclick = () => filterCarousels('SYNTHESIS', synthesisBtn);
                filterContainer.appendChild(synthesisBtn);
            }

            codes.forEach(code => {
                let btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "filter-btn";
                btn.innerText = code;
                btn.onclick = () => filterCarousels(code, btn);
                filterContainer.appendChild(btn);
            });
        }

        function filterCarousels(category, clickedBtn) {
            document.querySelectorAll('#filters .filter-btn').forEach(b => b.classList.remove('active'));
            clickedBtn.classList.add('active');

            document.getElementById('carousels-container')
                .classList.toggle('synthesis-only', category === 'SYNTHESIS');

            // Reset sélection fantôme
            resetQuizSelection();

            const sections = document.querySelectorAll('.category-section');
            sections.forEach(sec => {
                const secCode = sec.dataset.code || "AUTRE";
                const cards = [...sec.querySelectorAll('.quiz-card')];

                if (category === 'SYNTHESIS') {
                    cards.forEach(card => {
                        card.style.display = card.dataset.type === 'synthesis' ? '' : 'none';
                    });
                    sec.style.display = cards.some(card => card.dataset.type === 'synthesis') ? 'block' : 'none';
                    return;
                }

                cards.forEach(card => { card.style.display = ''; });
                sec.style.display = (category === 'ALL' || secCode === category) ? 'block' : 'none';
            });
        }

        function renderCarousels(data) {
            const container = document.getElementById('carousels-container');
            container.innerHTML = ""; 

            const banned = JSON.parse(localStorage.getItem('banned_questions_v1') || "[]");

            const groups = {};
            data.forEach(q => {
                const code = q.code || "AUTRE";
                if (!groups[code]) groups[code] = [];
                groups[code].push(q);
            });

            Object.keys(groups).sort().forEach(code => {
                const items = groups[code];
                const section = document.createElement('div');
                section.className = "category-section";
                section.dataset.code = code;

                const scrollContainer = document.createElement('div');
                scrollContainer.className = "horizontal-scroll";

                items.forEach(q => {
                    const card = document.createElement('div');
                    const isSynthesis = q.type === 'synthesis';
                    card.className = isSynthesis ? 'quiz-card synthesis-card' : 'quiz-card';
                    card.dataset.type = q.type || 'standard';
                    const icon = q.icon ? q.icon : "";

                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('aria-label', `${code} - ${q.name}`);
                    const activateCard = () => selectQuiz(q.file, card, q.name, q.subtitle, code);
                    card.onclick = activateCard;
                    card.onkeydown = event => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            activateCard();
                        }
                    };
                    
                    card.innerHTML = `
                        <div class="card-bg-icon">${icon}</div>
                        <div class="card-content">
                            <div class="card-top-row">
                                <span class="card-badge">${code}</span>
                                <span class="card-count" id="count-${q.file.replace(/\W/g,'')}">...</span>
                            </div>
                            <span class="card-title">${q.name}</span>
                            <span class="card-subtitle">${q.subtitle || ""}</span>
                        </div>
                    `;
                    
                    const storageKey = 'quiz_count_v2_' + q.file;
                    const cachedCount = localStorage.getItem(storageKey);
                    const badge = card.querySelector('.card-count');

                    if (cachedCount) {
                        badge.innerText = cachedCount + " Questions";
                        badge.style.opacity = "1";
                    } else {
                        fetch(q.file)
                            .then(res => res.json())
                            .then(quizData => {
                                if(quizData.questions) {
                                    const uniqueQ = quizData.questions.filter((v,i,a)=>a.findIndex(t=>(JSON.stringify(t)===JSON.stringify(v)))===i);
                                    const activeQ = uniqueQ.filter(item => !banned.includes(item.question));
                                    
                                    const count = activeQ.length;
                                    localStorage.setItem(storageKey, count);
                                    badge.innerText = count + " Questions";
                                    badge.style.opacity = "1";
                                }
                            })
                            .catch(e => {
                                badge.style.display = "none";
                            });
                    }

                    scrollContainer.appendChild(card);
                });

                section.appendChild(scrollContainer);
                container.appendChild(section);
            });
        }

        function selectQuiz(url, element, name, sub, code) {
            document.querySelectorAll('.quiz-card').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            element.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
            selectedQuizUrl = url;
            currentQuizFile = url; 
            currentQuizName = (code && code !== "AUTRE" ? code + " • " : "") + name;
            currentQuizSub = sub || "";
            document.getElementById('dock-selection').textContent = currentQuizName;
            checkReadyState();
        }

        function selectCount(value, element) {
            document.querySelectorAll('.count-pill').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            sessionSize = (value === "all") ? Infinity : parseInt(value, 10);
        }

        function checkReadyState() {
            const btn = document.getElementById('load-btn');
            if (!btn) return;
            btn.disabled = !selectedQuizUrl;
            if (selectedQuizUrl) btn.classList.add('ready');
            else btn.classList.remove('ready');
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function loadSelectedQuiz() {
            if (!selectedQuizUrl) return; 
            const btn = document.getElementById('load-btn');
            btn.innerText = "Chargement...";
            
            fetch(selectedQuizUrl)
                .then(res => res.json())
                .then(data => {
                    if (!data.questions) throw new Error("JSON invalide");
                    
                    const uniqueQuestions = data.questions.filter((q, index, self) =>
                        index === self.findIndex((t) => JSON.stringify(t) === JSON.stringify(q))
                    );
                    
                    const banned = JSON.parse(localStorage.getItem('banned_questions_v1') || "[]");
                    const cleanQuestions = uniqueQuestions.filter(q => !banned.includes(q.question));
                    
                    fullQuestionPool = cleanQuestions;
                    remainingQuestions = shuffle([...fullQuestionPool]);
                    
                    document.getElementById('setup-panel').style.display = 'none';
                    document.getElementById('header-area').style.display = 'none';
                    document.getElementById('quiz-interface').style.display = 'block';
                    document.getElementById('ctx-title').innerText = currentQuizName;
                    document.getElementById('ctx-sub').innerText = currentQuizSub;
                    
                    startSession();
                })
                .catch(err => {
                    document.getElementById('error-msg').style.display = 'block';
                    document.getElementById('error-msg').innerText = "Erreur : " + err.message;
                    btn.innerText = "Commencer";
                });
        }

        function startSession() {
            document.getElementById('quiz-interface').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';

            if (!remainingQuestions || remainingQuestions.length === 0) {
                remainingQuestions = shuffle([...fullQuestionPool]);
            }

            if (remainingQuestions.length === 0) {
                alert("Toutes les questions de ce module ont été masquées !");
                location.reload();
                return;
            }
            
            const n = (sessionSize === Infinity) ? remainingQuestions.length : Math.min(sessionSize, remainingQuestions.length);
            
            currentSession = remainingQuestions.slice(0, n);
            remainingQuestions = remainingQuestions.slice(n);
            lastSession = currentSession.slice(); 
            lastSessionRemainingSnapshot = remainingQuestions;
            
            currentIndex = 0; score = 0; startTime = new Date();

            document.getElementById('quiz-container').innerHTML = '';
            showQuestion();
        }

        // --- CORRECTION BUG REFAIRE + BANNIS ---
        function restartSameSession() {
            document.getElementById('quiz-interface').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';

            if (!lastSession.length) { startSession(); return; }
            
            // 1. Charger liste noire
            const banned = JSON.parse(localStorage.getItem('banned_questions_v1') || "[]");
            
            // 2. Filtrer la sauvegarde
            currentSession = lastSession.filter(q => !banned.includes(q.question));
            
            if (currentSession.length === 0) {
                alert("Vous avez masqué toutes les questions de cette série !");
                startSession(); // On repart sur du neuf
                return;
            }

            currentIndex = 0; score = 0; startTime = new Date();
            document.getElementById('quiz-container').innerHTML = '';
            showQuestion();
        }

        function showQuestion() {
            const q = currentSession[currentIndex];
            const container = document.getElementById('quiz-container');
            document.getElementById('progress').innerText = `${currentIndex + 1} / ${currentSession.length}`;
            
            const lowerOpts = q.options.map(o => o.toLowerCase().trim());
            const isVF = q.options.length === 2 && lowerOpts.includes("vrai") && lowerOpts.includes("faux");
            
            let inputType = isVF ? 'radio' : 'checkbox';
            let hint = isVF ? "(Vrai ou Faux)" : "(Cochez la ou les bonnes réponses)";
            
            let optionsWithIndex = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
            if (!isVF) optionsWithIndex = shuffle(optionsWithIndex);

            let html = `
            <div class="question-box active">
                <div class="question-title">${q.question}</div>
                <div class="hint-text">${hint}</div>
                <div class="options">
                    ${optionsWithIndex.map((opt, i) => `
                        <label id="opt-${i}">
                            <input type="${inputType}" name="option" value="${opt.originalIndex}">
                            <span>${opt.text}</span>
                        </label>
                    `).join('')}
                </div>
                <button id="validate-btn" class="btn" onclick="validate()">Valider</button>
                <div class="feedback-text" id="feedback"></div>
                
                <button class="ban-btn" onclick="banQuestion()">
                    👁️ Masquer définitivement cette question
                </button>
            </div>`;
            container.innerHTML = html;
        }

        function banQuestion() {
            const q = currentSession[currentIndex];
            
            if(!confirm("Masquer définitivement cette question ?")) return;

            let banned = JSON.parse(localStorage.getItem('banned_questions_v1') || "[]");
            if (!banned.includes(q.question)) {
                banned.push(q.question);
                localStorage.setItem('banned_questions_v1', JSON.stringify(banned));
            }

            if(currentQuizFile) {
                localStorage.removeItem('quiz_count_v2_' + currentQuizFile);
            }

            currentSession.splice(currentIndex, 1);
            
            if(currentSession.length === 0) {
                 alert("Session terminée.");
                 endQuiz();
                 return;
            }

            if (currentIndex >= currentSession.length) {
                endQuiz();
            } else {
                showQuestion(); 
            }
        }

        function resetBannedQuestions() {
            if(confirm("Voulez-vous réintégrer toutes les questions que vous avez masquées ?")) {
                localStorage.removeItem('banned_questions_v1');
                Object.keys(localStorage).forEach(key => {
                    if(key.startsWith('quiz_count_v1_') || key.startsWith('quiz_count_v2_')) localStorage.removeItem(key);
                });
                alert("Les questions masquées ont été réinitialisées.");
                location.reload();
            }
        }

        // --- HARD RESET PWA ---
        async function fullAppReset() {
            if(!confirm("Ceci va effacer les données locales, réintégrer les questions masquées et forcer la mise à jour de l'application. Continuer ? A ne surtout pas faire si vous ne disposez pas de connexion Internet !")) return;

            if ('caches' in window) {
                const names = await caches.keys();
                await Promise.all(names.map(name => caches.delete(name)));
            }

            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (const registration of registrations) {
                    await registration.unregister();
                }
            }

            localStorage.clear();
            window.location.reload(true);
        }

        window.validate = function () {
            const q = currentSession[currentIndex];
            const allInputs = document.querySelectorAll('input[name="option"]');
            const checkedInputs = document.querySelectorAll('input[name="option"]:checked');
            if (checkedInputs.length === 0) return alert("Une réponse est requise");
            document.getElementById('validate-btn').style.display = 'none';
            document.querySelector('.ban-btn').style.display = 'none';
            
            allInputs.forEach(i => i.disabled = true);
            
            const checkedValues = Array.from(checkedInputs).map(cb => parseInt(cb.value, 10));
            const a = q.correct.slice().sort((x,y)=>x-y);
            const b = checkedValues.slice().sort((x,y)=>x-y);
            const isCorrect = JSON.stringify(a) === JSON.stringify(b);
            
            if (isCorrect) score++;

            allInputs.forEach((input, domIndex) => {
                const val = parseInt(input.value);
                const label = document.getElementById(`opt-${domIndex}`);
                if (!label) return;
                if (q.correct.includes(val)) input.checked ? label.classList.add('correct-checked') : label.classList.add('missed-correct');
                else input.checked ? label.classList.add('wrong-checked') : label.classList.add('neutral-disabled');
            });

            const nextText = currentIndex === currentSession.length - 1 ? "Voir les résultats" : "Suivant";
            let explanation = (q.explanation && q.explanation.trim() !== "") 
                ? `<div style="margin-top:10px; font-weight:400; color:#2d3748; line-height:1.5; font-size:0.95rem;">${q.explanation}</div>` : "";
            const fb = document.getElementById('feedback');
            fb.style.display = 'block';
            fb.innerHTML = `<strong>${isCorrect ? "BRAVO ! 🎉" : "DOMMAGE..."}</strong>${explanation}<button class="btn btn-next" onclick="nextQuestion()">${nextText}</button>`;
            fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };

        window.nextQuestion = function () {
            if (currentIndex < currentSession.length - 1) { currentIndex++; showQuestion(); } else { endQuiz(); }
        };

        function endQuiz() {
            const timeDiff = Math.floor((new Date() - startTime) / 1000);
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            document.getElementById('quiz-interface').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerText = `${score}/${currentSession.length}`;
            document.getElementById('final-time').innerText = `${minutes}m ${seconds}s`;
            
            const ratio = currentSession.length > 0 ? score / currentSession.length : 0;
            
            const comment = document.getElementById('comment');
            if (ratio >= 0.8) { comment.innerText = "Excellent ! 🏆"; comment.style.color = "#48bb78"; }
            else if (ratio >= 0.5) { comment.innerText = "Bien joué ! 👍"; comment.style.color = "#ed8936"; }
            else { comment.innerText = "Courage ! 💪"; comment.style.color = "#e53e3e"; }
            
            const contBtn = document.getElementById('continue-btn');
            const msg = document.getElementById('detail-msg');

            if (remainingQuestions.length > 0 && sessionSize !== Infinity) {
                contBtn.style.display = 'block';
                contBtn.innerText = `Continuer la suite`;
                msg.innerText = `📦 Il reste encore ${remainingQuestions.length} questions inédites dans ce module.`;
            } else {
                contBtn.style.display = 'none';
                msg.innerText = `🎉 Vous avez fait le tour de toutes les questions disponibles !`;
            }
        }
    </script>
