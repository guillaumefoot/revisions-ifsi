<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Révisions IFSI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA -->
  <link rel="manifest" href="/revisions-ifsi/manifest.json">
  <meta name="theme-color" content="#3498db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/revisions-ifsi/icons/icon-192.png">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 12px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
    h1 { margin-top: 0; }
    select, button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      margin-top: 10px;
    }
    .progress {
      text-align: right;
      color: #3498db;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .question-title {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .options label {
      display: block;
      margin-bottom: 8px;
    }
    .btn {
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn.secondary {
      background: #555;
    }
    #result-screen {
      display: none;
      text-align: center;
    }
  </style>
</head>

<body>
<div class="container">

  <h1 id="main-title">Révisions IFSI</h1>
  <p id="sub-title">Choisis un quiz</p>

  <!-- SETUP -->
  <div id="setup-panel">
    <select id="quiz-select">
      <option value="">— Choisir un quiz —</option>
    </select>

    <select id="count-select" disabled>
      <option value="5">5 questions</option>
      <option value="10" selected>10 questions</option>
      <option value="20">20 questions</option>
      <option value="all">Toutes les questions</option>
    </select>

    <button class="btn" onclick="loadSelectedQuiz()">Lancer</button>
  </div>

  <!-- QUIZ -->
  <div class="progress" id="progress" style="display:none;"></div>
  <div id="quiz-container"></div>

  <!-- RESULT -->
  <div id="result-screen">
    <h2>Session terminée</h2>
    <p id="final-score"></p>

    <button id="continue-btn" class="btn" style="display:none;" onclick="startSession()">
      Continuer
    </button>

    <button class="btn secondary" onclick="location.reload()">
      Changer de quiz
    </button>
  </div>

</div>

<script>
/* ------------------ VARIABLES ------------------ */
let fullQuestionPool = [];
let remainingQuestions = [];
let currentSession = [];
let currentIndex = 0;
let score = 0;
let sessionSize = 10;
let selectedQuizName = "";

/* ------------------ INIT ------------------ */
fetch('quizzes.json?v=' + Date.now(), { cache: 'no-store' })
  .then(r => r.json())
  .then(data => {
    const select = document.getElementById('quiz-select');
    data.quizzes.forEach(q => {
      const opt = document.createElement('option');
      opt.value = q.file;
      opt.textContent = q.name;
      select.appendChild(opt);
    });
    document.getElementById('count-select').disabled = false;
  });

/* ------------------ LOAD QUIZ ------------------ */
function loadSelectedQuiz() {
  const select = document.getElementById('quiz-select');
  const file = select.value;
  if (!file) return alert("Choisis un quiz");

  selectedQuizName = select.options[select.selectedIndex].textContent;

  const countVal = document.getElementById('count-select').value;
  sessionSize = (countVal === "all") ? Infinity : parseInt(countVal, 10);

  fetch(file + '?v=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      fullQuestionPool = data.questions;
      remainingQuestions = shuffle([...fullQuestionPool]);

      document.getElementById('main-title').innerText = selectedQuizName;
      document.getElementById('sub-title').innerText =
        `${fullQuestionPool.length} questions disponibles`;

      document.getElementById('setup-panel').style.display = 'none';
      startSession();
    });
}

/* ------------------ SESSION ------------------ */
function startSession() {
  if (remainingQuestions.length === 0) {
    remainingQuestions = shuffle([...fullQuestionPool]);
  }

  const n = (sessionSize === Infinity)
    ? remainingQuestions.length
    : Math.min(sessionSize, remainingQuestions.length);

  currentSession = remainingQuestions.slice(0, n);
  remainingQuestions = remainingQuestions.slice(n);

  currentIndex = 0;
  score = 0;

  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-container').innerHTML = '';
  document.getElementById('progress').style.display = 'block';

  showQuestion();
}

/* ------------------ QUESTION ------------------ */
function showQuestion() {
  const q = currentSession[currentIndex];
  document.getElementById('progress').innerText =
    `Question ${currentIndex + 1} / ${currentSession.length}`;

  const html = `
    <div class="question-title">${q.question}</div>
    ${q.options.map((o,i)=>`
      <label>
        <input type="checkbox" value="${i}"> ${o}
      </label>
    `).join('')}
    <button class="btn" onclick="validate()">Valider</button>
  `;
  document.getElementById('quiz-container').innerHTML = html;
}

/* ------------------ VALIDATION ------------------ */
function validate() {
  const q = currentSession[currentIndex];
  const checked = [...document.querySelectorAll('input:checked')]
    .map(i => parseInt(i.value))
    .sort()
    .toString();

  const correct = [...q.correct].sort().toString();
  if (checked === correct) score++;

  if (currentIndex < currentSession.length - 1) {
    currentIndex++;
    showQuestion();
  } else {
    endQuiz();
  }
}

/* ------------------ FIN ------------------ */
function endQuiz() {
  document.getElementById('quiz-container').innerHTML = '';
  document.getElementById('progress').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  document.getElementById('final-score').innerText =
    `${score} / ${currentSession.length}`;

  const btn = document.getElementById('continue-btn');
  if (remainingQuestions.length > 0 && sessionSize !== Infinity) {
    btn.style.display = 'block';
    btn.innerText =
      `Continuer (${Math.min(sessionSize, remainingQuestions.length)} questions restantes : ${remainingQuestions.length})`;
  } else {
    btn.style.display = 'none';
  }
}

/* ------------------ UTILS ------------------ */
function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

/* ------------------ SERVICE WORKER ------------------ */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/revisions-ifsi/sw.js');
}
</script>

</body>
</html>
