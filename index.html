<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="manifest" href="/revisions-ifsi/manifest.json">
    <meta name="theme-color" content="#3498db">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moteur Révisions IFSI</title>
    <style>
        /* --- STYLES GLOBAUX --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #2d3436;
            margin: 0;
            padding: 15px;
            line-height: 1.5;
            font-size: 16px;
        }

        .container {
            background-color: white;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle-main {
            text-align: center; color: #a0aec0; margin-bottom: 25px; font-size: 0.95rem;
        }

        /* --- FILTRES --- */
        .filter-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 15px; 
            padding-left: 5px; padding-right: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid #f1f2f6;
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch;
        }
        .filter-container::-webkit-scrollbar { display: none; }

        .filter-btn {
            background-color: #fff;
            border: 1px solid #dfe6e9;
            color: #636e72;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .filter-btn:hover { background-color: #f1f2f6; border-color: #b2bec3; }

        .filter-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.25);
        }

        /* --- CARROUSEL --- */
        .category-section {
            margin-bottom: 20px;
            animation: fadeInSection 0.3s ease-out;
        }
        @keyframes fadeInSection {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SCROLL HORIZONTAL */
        .horizontal-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-top: 10px; 
            padding-bottom: 25px; 
            padding-left: 5px;
            padding-right: 5px;
            scroll-snap-type: x mandatory; 
            -webkit-overflow-scrolling: touch;
        }
        
        .horizontal-scroll::-webkit-scrollbar { height: 8px; }
        .horizontal-scroll::-webkit-scrollbar-track { background: #f1f2f6; border-radius: 4px; margin: 0 10px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #bdc3c7; border-radius: 4px; }
        .horizontal-scroll::-webkit-scrollbar-thumb:hover { background: #95a5a6; }

        /* --- CARTE DESIGN --- */
        .quiz-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative; 
            overflow: hidden;   
            min-width: 280px;
            max-width: 280px;
            height: 220px;
            scroll-snap-align: start;
            flex-shrink: 0;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
            border-color: #cbd5e0;
            box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        }

        .quiz-card.selected {
            border-color: #3498db;
            background-color: #f0f9ff;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .card-bg-icon {
            position: absolute;
            bottom: -15px;
            right: -10px;
            font-size: 6rem; 
            opacity: 0.08;   
            line-height: 1;
            z-index: 0;      
            pointer-events: none;
            filter: grayscale(100%); 
            transform: rotate(-10deg);
        }

        .card-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* --- LIGNE DES BADGES --- */
        .card-top-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            min-height: 24px;
        }

        .card-badge {
            background-color: #eaf6fd;
            color: #3498db;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.2;
            display: inline-flex;
            align-items: center;
        }

        .card-count {
            background-color: #f7fafc;
            color: #95a5a6;
            border: 1px solid #edf2f7;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 6px;
            opacity: 0; 
            transition: opacity 0.3s ease;
            margin: 0;
            line-height: 1.2;
            display: inline-flex;
            align-items: center;
        }

        .card-title {
            font-weight: 800;
            font-size: 1.1rem;
            color: #2d3748;
            line-height: 1.3;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .card-subtitle { 
            font-size: 0.9rem; 
            color: #718096; 
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 5; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: normal;
            margin-top: auto;
        }

        /* SETUP QUANTITE */
        .count-selector-container { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        
        .section-label {
            font-weight: 700; color: #b2bec3; margin-bottom: 15px;
            display: block; text-transform: uppercase; font-size: 0.75rem;
            letter-spacing: 1px; text-align: center;
        }

        .count-options { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

        .count-pill {
            padding: 8px 20px; background-color: #edf2f7; border-radius: 50px;
            cursor: pointer; font-weight: 600; color: #718096; transition: all 0.2s;
            border: 2px solid transparent; font-size: 0.95rem;
        }

        .count-pill:hover { background-color: #e2e8f0; }
        .count-pill.selected {
            background-color: #3498db; color: white;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.25);
            border-color: #3498db;
        }

        /* BOUTON LANCER */
        .start-btn {
            background-color: #2c3e50; color: white; padding: 16px 40px;
            border-radius: 14px; cursor: pointer; font-weight: 700; border: none;
            font-size: 1.1rem; transition: all 0.3s; width: 100%; display: block;
            margin: 0 auto; opacity: 0.5; pointer-events: none;
        }

        .start-btn.ready {
            background-color: #3498db; opacity: 1; pointer-events: auto;
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.25);
        }
        .start-btn.ready:hover { transform: translateY(-2px); background-color: #2980b9; }

        /* --- UI QUIZ --- */
        .quiz-context-header {
            text-align: center; margin-bottom: 20px; padding-bottom: 15px;
            border-bottom: 1px solid #edf2f7;
        }
        .context-title { font-weight: 800; color: #3498db; font-size: 0.9rem; text-transform: uppercase; }
        .context-subtitle { color: #718096; font-size: 0.85rem; margin-top: 4px; }

        .progress {
            text-align: right; color: #cbd5e0; font-weight: 700;
            font-size: 0.85rem; margin-bottom: 10px;
        }

        .question-box { display: none; animation: fadeIn 0.3s ease-out; }
        .question-box.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .question-title {
            font-size: 1.3rem; 
            font-weight: 700; margin-bottom: 20px;
            color: #2d3748; line-height: 1.4;
        }

        .hint-text {
            display: inline-block; background: #ebf8ff; color: #3182ce;
            padding: 5px 10px; border-radius: 6px; font-size: 0.8rem;
            font-weight: 700; margin-bottom: 20px;
        }

        .options { display: flex; flex-direction: column; gap: 10px; }

        .options label {
            display: flex; align-items: flex-start;
            padding: 16px;
            background-color: #fff; border: 2px solid #edf2f7;
            border-radius: 12px; cursor: pointer; transition: all 0.15s ease;
            font-size: 1rem; color: #4a5568;
        }

        .options label span { margin-top: 1px; }

        .options label:hover { border-color: #cbd5e0; }
        .options label:active { transform: scale(0.99); background-color: #f7fafc; }

        .options input[type="checkbox"], .options input[type="radio"] {
            appearance: none; width: 22px; height: 22px;
            border: 2px solid #cbd5e0; border-radius: 6px; margin-right: 15px;
            display: grid; place-content: center; flex-shrink: 0; transition: 0.2s;
            margin-top: 3px;
        }
        .options input[type="radio"] { border-radius: 50%; }
        .options input:checked { border-color: #3498db; background-color: #3498db; }
        
        .options input:checked::before {
            content: ""; width: 9px; height: 9px; background: white;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .options input[type="radio"]:checked::before { clip-path: circle(50%); }

        .options label.correct-checked { background-color: #f0fff4; border-color: #48bb78; color: #22543d; }
        .options label.correct-checked input { background-color: #48bb78; border-color: #48bb78; }
        .options label.wrong-checked { background-color: #fff5f5; border-color: #f56565; color: #742a2a; }
        .options label.wrong-checked input { background-color: #f56565; border-color: #f56565; }
        .options label.missed-correct { border-color: #48bb78; background-color: #fff; border-style: dashed; }
        .options label.neutral-disabled { opacity: 0.5; pointer-events: none; }

        .btn {
            background-color: #3498db; color: white; border: none; padding: 16px;
            font-size: 1.1rem; border-radius: 12px; cursor: pointer; margin-top: 25px;
            width: 100%; font-weight: 700; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
        }
        .btn-next { background-color: #2d3748; box-shadow: none; }

        .feedback-text {
            margin-top: 20px; padding: 15px; background-color: #fffaf0;
            border-left: 5px solid #ed8936; border-radius: 8px;
            font-size: 0.95rem; color: #9c4221; display: none;
        }
        
        /* STYLE BOUTON MASQUER */
        .ban-btn {
            display: block; margin: 25px auto 0 auto;
            background-color: transparent;
            border: 1px solid #bdc3c7;
            color: #95a5a6;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: auto;
        }
        .ban-btn:hover { border-color: #7f8c8d; color: #7f8c8d; background-color: #f8f9fa; }

        /* FOOTER RESET */
        .footer-reset {
            margin-top: 30px; text-align: center;
            border-top: 1px solid #f1f2f6; padding-top: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .reset-link { color: #b2bec3; font-size: 0.8rem; text-decoration: none; cursor: pointer; }
        .reset-link:hover { text-decoration: underline; color: #636e72; }
        
        /* Lien Force Update */
        .force-update { color: #e53e3e; opacity: 0.7; }
        .force-update:hover { opacity: 1; }

        /* Resultats */
        #result-screen { display: none; text-align: center; padding: 10px 0; }
        .score-circle {
            width: 110px; height: 110px; background: white;
            border: 6px solid #3498db;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #3498db; font-size: 2.2rem; font-weight: 800; margin: 20px auto;
        }
        .time-stat { color: #a0aec0; font-size: 1rem; margin-top: -15px; margin-bottom: 25px; }
        
        #detail-msg { font-size: 0.95rem; color: #7f8c8d; margin-bottom: 20px; font-weight: 500; }

        /* --- OPTIMISATION MOBILE --- */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px 15px; border-radius: 16px; box-shadow: none; min-height: auto; }
            h1 { font-size: 1.5rem; }
            .start-btn { margin-bottom: 20px; }
            
            .question-title { font-size: 1.15rem; }
            .options label { padding: 14px; font-size: 0.95rem; }
            
            .horizontal-scroll::-webkit-scrollbar { display: none; }
            .horizontal-scroll { scrollbar-width: none; }
            
            .quiz-card {
                min-width: 260px;
                max-width: 260px;
                height: 200px;
                padding: 18px;
            }
            
            .card-badge { margin: 0; }
            .card-title { font-size: 1rem; -webkit-line-clamp: 3; }
            .card-subtitle { font-size: 0.85rem; -webkit-line-clamp: 4; }
            .card-bg-icon { font-size: 5rem; bottom: -10px; right: -8px; }
            
            .category-section { margin-bottom: 30px; }
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="header-area">
            <h1 id="app-title">🎓 RÉVISIONS IFSI</h1>
            <div class="subtitle-main">Choisis un module pour t'entraîner</div>
        </div>

        <div id="setup-panel">
            <div id="loading-spinner" style="text-align:center; padding:20px; color:#a0aec0; font-size:1rem;">
                Chargement...
            </div>

            <div id="grid-section" style="display:none;">
                
                <div id="filters" class="filter-container"></div>
                <div id="carousels-container"></div>

                <div class="count-selector-container">
                    <span class="section-label">Nombre de questions</span>
                    <div class="count-options">
                        <div class="count-pill" onclick="selectCount(5, this)">5</div>
                        <div class="count-pill selected" onclick="selectCount(10, this)">10</div>
                        <div class="count-pill" onclick="selectCount(20, this)">20</div>
                        <div class="count-pill" onclick="selectCount('all', this)">Tout</div>
                    </div>
                </div>

                <button id="load-btn" class="start-btn" onclick="loadSelectedQuiz()">
                    Commencer
                </button>
                
                <div class="footer-reset">
                    <span class="reset-link" onclick="resetBannedQuestions()">Réintégrer les questions masquées</span>
                    <span class="reset-link force-update" onclick="fullAppReset()">🔄 Forcer la mise à jour (Bug ?)</span>
                </div>
            </div>

            <div id="error-msg" style="color:#e53e3e; margin-top:20px; text-align:center; display:none; font-weight:bold;"></div>
        </div>

        <div id="quiz-interface" style="display:none;">
            <div class="quiz-context-header">
                <div class="context-title" id="ctx-title">UE --</div>
                <div class="context-subtitle" id="ctx-sub">Sujet</div>
            </div>

            <div class="progress" id="progress"></div>
            <div id="quiz-container"></div>
        </div>

        <div id="result-screen">
            <h2>Terminé !</h2>
            <div class="score-circle" id="final-score">0/0</div>
            <div class="time-stat" id="final-time">-- min -- s</div>
            <h3 id="comment" style="margin-bottom: 10px;"></h3>
            
            <p id="detail-msg"></p>

            <button id="continue-btn" class="btn btn-next" style="display:none;" onclick="startSession()">Continuer la suite</button>
            <button class="btn" onclick="restartSameSession()">Refaire cette série</button>
            <button class="btn" style="background-color:#cbd5e0; color:#4a5568; margin-top:15px;" onclick="location.reload()">Changer de sujet</button>
        </div>
    </div>

    <script>
        let sessionSize = 10;
        let selectedQuizUrl = null; 
        let currentQuizFile = null;
        let currentQuizName = "";
        let currentQuizSub = "";
        let fullQuestionPool = [];
        let remainingQuestions = [];
        let currentSession = [];
        let lastSession = [];
        let lastSessionRemainingSnapshot = [];
        let currentIndex = 0;
        let score = 0;
        let startTime = 0;

        window.onload = function () {
            fetch('quizzes.json')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading-spinner').style.display = 'none';
                    document.getElementById('grid-section').style.display = 'block';
                    generateFilters(data);
                    renderCarousels(data);
                })
                .catch(err => {
                    document.getElementById('loading-spinner').style.display = 'none';
                    document.getElementById('error-msg').style.display = 'block';
                    document.getElementById('error-msg').innerText = "Erreur : " + err.message;
                });
        };

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/revisions-ifsi/sw.js");
            });
        }

        function generateFilters(data) {
            const filterContainer = document.getElementById('filters');
            const codes = [...new Set(data.map(q => q.code || "AUTRE"))].sort();
            
            let allBtn = document.createElement('div');
            allBtn.className = "filter-btn active";
            allBtn.innerText = "TOUT";
            allBtn.onclick = () => filterCarousels('ALL', allBtn);
            filterContainer.appendChild(allBtn);

            codes.forEach(code => {
                let btn = document.createElement('div');
                btn.className = "filter-btn";
                btn.innerText = code;
                btn.onclick = () => filterCarousels(code, btn);
                filterContainer.appendChild(btn);
            });
        }

        function filterCarousels(category, clickedBtn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            clickedBtn.classList.add('active');

            // Reset sélection fantôme
            document.querySelectorAll('.quiz-card').forEach(el => el.classList.remove('selected'));
            selectedQuizUrl = null;
            currentQuizFile = null; 
            checkReadyState();

            const sections = document.querySelectorAll('.category-section');
            sections.forEach(sec => {
                const secCode = sec.dataset.code || "AUTRE";
                if (category === 'ALL' || secCode === category) {
                    sec.style.display = 'block';
                } else {
                    sec.style.display = 'none';
                }
            });
        }

        function renderCarousels(data) {
            const container = document.getElementById('carousels-container');
            container.innerHTML = ""; 

            const banned = JSON.parse(localStorage.getItem('banned_questions_v1') || "[]");

            const groups = {};
            data.forEach(q => {
                const code = q.code || "AUTRE";
                if (!groups[code]) groups[code] = [];
                groups[code].push(q);
            });

            Object.keys(groups).sort().forEach(code => {
                const items = groups[code];
                const section = document.createElement('div');
                section.className = "category-section";
                section.dataset.code = code;

                const scrollContainer = document.createElement('div');
                scrollContainer.className = "horizontal-scroll";

                items.forEach(q => {
                    const card = document.createElement('div');
                    card.className = 'quiz-card';
                    const icon = q.icon ? q.icon : ""; 

                    card.onclick = () => selectQuiz(q.file, card, q.name, q.subtitle, code);
                    
                    card.innerHTML = `
                        <div class="card-bg-icon">${icon}</div>
                        <div class="card-content">
                            <div class="card-top-row">
                                <span class="card-badge">${code}</span>
                                <span class="card-count" id="count-${q.file.replace(/\W/g,'')}">...</span>
                            </div>
                            <span class="card-title">${q.name}</span>
                            <span class="card-subtitle">${q.subtitle || ""}</span>
                        </div>
                    `;
                    
                    const storageKey = 'quiz_count_v1_' + q.file;
                    const cachedCount = localStorage.getItem(storageKey);
                    const badge = card.querySelector('.card-count');

                    if (cachedCount) {
                        badge.innerText = cachedCount + " Questions";
                        badge.style.opacity = "1";
                    } else {
                        fetch(q.file)
                            .then(res => res.json())
                            .then(quizData => {
                                if(quizData.questions) {
                                    const uniqueQ = quizData.questions.filter((v,i,a)=>a.findIndex(t=>(t.question===v.question))===i);
                                    const activeQ = uniqueQ.filter(item => !banned.includes(item.question));
                                    
                                    const count = activeQ.length;
                                    localStorage.setItem(storageKey, count);
                                    badge.innerText = count + " Questions";
                                    badge.style.opacity = "1";
                                }
                            })
                            .catch(e => {
                                badge.style.display = "none";
                            });
                    }

                    scrollContainer.appendChild(card);
                });

                section.appendChild(scrollContainer);
                container.appendChild(section);
            });
        }

        function selectQuiz(url, element, name, sub, code) {
            document.querySelectorAll('.quiz-card').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedQuizUrl = url;
            currentQuizFile = url; 
            currentQuizName = (code && code !== "AUTRE" ? code + " • " : "") + name;
            currentQuizSub = sub || "";
            checkReadyState();
        }

        function selectCount(value, element) {
            document.querySelectorAll('.count-pill').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            sessionSize = (value === "all") ? Infinity : parseInt(value, 10);
        }

        function checkReadyState() {
            const btn = document.getElementById('load-btn');
            if (selectedQuizUrl) btn.classList.add('ready');
            else btn.classList.remove('ready');
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function loadSelectedQuiz() {
            if (!selectedQuizUrl) return; 
            const btn = document.getElementById('load-btn');
            btn.innerText = "Chargement...";
            
            fetch(selectedQuizUrl)
                .then(res => res.json())
                .then(data => {
                    if (!data.questions) throw new Error("JSON invalide");
                    
                    const uniqueQuestions = data.questions.filter((q, index, self) =>
                        index === self.findIndex((t) => t.question === q.question)
                    );
                    
                    const banned = JSON.parse(localStorage.getItem('banned_questions_v1') || "[]");
                    const cleanQuestions = uniqueQuestions.filter(q => !banned.includes(q.question));
                    
                    fullQuestionPool = cleanQuestions;
                    remainingQuestions = shuffle([...fullQuestionPool]);
                    
                    document.getElementById('setup-panel').style.display = 'none';
                    document.getElementById('header-area').style.display = 'none';
                    document.getElementById('quiz-interface').style.display = 'block';
                    document.getElementById('ctx-title').innerText = currentQuizName;
                    document.getElementById('ctx-sub').innerText = currentQuizSub;
                    
                    startSession();
                })
                .catch(err => {
                    document.getElementById('error-msg').style.display = 'block';
                    document.getElementById('error-msg').innerText = "Erreur : " + err.message;
                    btn.innerText = "Commencer";
                });
        }

        function startSession() {
            document.getElementById('quiz-interface').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';

            if (!remainingQuestions || remainingQuestions.length === 0) {
                remainingQuestions = shuffle([...fullQuestionPool]);
            }

            if (remainingQuestions.length === 0) {
                alert("Toutes les questions de ce module ont été masquées !");
                location.reload();
                return;
            }
            
            const n = (sessionSize === Infinity) ? remainingQuestions.length : Math.min(sessionSize, remainingQuestions.length);
            
            currentSession = remainingQuestions.slice(0, n);
            remainingQuestions = remainingQuestions.slice(n);
            lastSession = currentSession.slice(); 
            lastSessionRemainingSnapshot = remainingQuestions;
            
            currentIndex = 0; score = 0; startTime = new Date();

            document.getElementById('quiz-container').innerHTML = '';
            showQuestion();
        }

        // --- CORRECTION BUG REFAIRE + BANNIS ---
        function restartSameSession() {
            document.getElementById('quiz-interface').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';

            if (!lastSession.length) { startSession(); return; }
            
            // 1. Charger liste noire
            const banned = JSON.parse(localStorage.getItem('banned_questions_v1') || "[]");
            
            // 2. Filtrer la sauvegarde
            currentSession = lastSession.filter(q => !banned.includes(q.question));
            
            if (currentSession.length === 0) {
                alert("Vous avez masqué toutes les questions de cette série !");
                startSession(); // On repart sur du neuf
                return;
            }

            currentIndex = 0; score = 0; startTime = new Date();
            document.getElementById('quiz-container').innerHTML = '';
            showQuestion();
        }

        function showQuestion() {
            const q = currentSession[currentIndex];
            const container = document.getElementById('quiz-container');
            document.getElementById('progress').innerText = `${currentIndex + 1} / ${currentSession.length}`;
            
            const lowerOpts = q.options.map(o => o.toLowerCase().trim());
            const isVF = q.options.length === 2 && lowerOpts.includes("vrai") && lowerOpts.includes("faux");
            
            let inputType = isVF ? 'radio' : 'checkbox';
            let hint = isVF ? "(Vrai ou Faux)" : "(Cochez la ou les bonnes réponses)";
            
            let optionsWithIndex = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
            if (!isVF) optionsWithIndex = shuffle(optionsWithIndex);

            let html = `
            <div class="question-box active">
                <div class="question-title">${q.question}</div>
                <div class="hint-text">${hint}</div>
                <div class="options">
                    ${optionsWithIndex.map((opt, i) => `
                        <label id="opt-${i}">
                            <input type="${inputType}" name="option" value="${opt.originalIndex}">
                            <span>${opt.text}</span>
                        </label>
                    `).join('')}
                </div>
                <button id="validate-btn" class="btn" onclick="validate()">Valider</button>
                <div class="feedback-text" id="feedback"></div>
                
                <button class="ban-btn" onclick="banQuestion()">
                    👁️ Masquer définitivement cette question
                </button>
            </div>`;
            container.innerHTML = html;
        }

        function banQuestion() {
            const q = currentSession[currentIndex];
            
            if(!confirm("Masquer définitivement cette question ?")) return;

            let banned = JSON.parse(localStorage.getItem('banned_questions_v1') || "[]");
            if (!banned.includes(q.question)) {
                banned.push(q.question);
                localStorage.setItem('banned_questions_v1', JSON.stringify(banned));
            }

            if(currentQuizFile) {
                localStorage.removeItem('quiz_count_v1_' + currentQuizFile);
            }

            currentSession.splice(currentIndex, 1);
            
            if(currentSession.length === 0) {
                 alert("Session terminée.");
                 endQuiz();
                 return;
            }

            if (currentIndex >= currentSession.length) {
                endQuiz();
            } else {
                showQuestion(); 
            }
        }

        function resetBannedQuestions() {
            if(confirm("Voulez-vous réintégrer toutes les questions que vous avez masquées ?")) {
                localStorage.removeItem('banned_questions_v1');
                Object.keys(localStorage).forEach(key => {
                    if(key.startsWith('quiz_count_v1_')) localStorage.removeItem(key);
                });
                alert("Les questions masquées ont été réinitialisées.");
                location.reload();
            }
        }

        // --- HARD RESET PWA ---
        async function fullAppReset() {
            if(!confirm("Ceci va effacer les données locales, réintégrer les questions masquées et forcer la mise à jour de l'application. Continuer ? A ne surtout pas faire si vous ne disposez pas de connexion Internet !")) return;

            if ('caches' in window) {
                const names = await caches.keys();
                await Promise.all(names.map(name => caches.delete(name)));
            }

            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (const registration of registrations) {
                    await registration.unregister();
                }
            }

            localStorage.clear();
            window.location.reload(true);
        }

        window.validate = function () {
            const q = currentSession[currentIndex];
            const allInputs = document.querySelectorAll('input[name="option"]');
            const checkedInputs = document.querySelectorAll('input[name="option"]:checked');
            if (checkedInputs.length === 0) return alert("Une réponse est requise");
            document.getElementById('validate-btn').style.display = 'none';
            document.querySelector('.ban-btn').style.display = 'none';
            
            allInputs.forEach(i => i.disabled = true);
            
            const checkedValues = Array.from(checkedInputs).map(cb => parseInt(cb.value, 10));
            const a = q.correct.slice().sort((x,y)=>x-y);
            const b = checkedValues.slice().sort((x,y)=>x-y);
            const isCorrect = JSON.stringify(a) === JSON.stringify(b);
            
            if (isCorrect) score++;

            allInputs.forEach((input, domIndex) => {
                const val = parseInt(input.value);
                const label = document.getElementById(`opt-${domIndex}`);
                if (!label) return;
                if (q.correct.includes(val)) input.checked ? label.classList.add('correct-checked') : label.classList.add('missed-correct');
                else input.checked ? label.classList.add('wrong-checked') : label.classList.add('neutral-disabled');
            });

            const nextText = currentIndex === currentSession.length - 1 ? "Voir les résultats" : "Suivant";
            let explanation = (q.explanation && q.explanation.trim() !== "") 
                ? `<div style="margin-top:10px; font-weight:400; color:#2d3748; line-height:1.5; font-size:0.95rem;">${q.explanation}</div>` : "";
            const fb = document.getElementById('feedback');
            fb.style.display = 'block';
            fb.innerHTML = `<strong>${isCorrect ? "BRAVO ! 🎉" : "DOMMAGE..."}</strong>${explanation}<button class="btn btn-next" onclick="nextQuestion()">${nextText}</button>`;
            fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };

        window.nextQuestion = function () {
            if (currentIndex < currentSession.length - 1) { currentIndex++; showQuestion(); } else { endQuiz(); }
        };

        function endQuiz() {
            const timeDiff = Math.floor((new Date() - startTime) / 1000);
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            document.getElementById('quiz-interface').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerText = `${score}/${currentSession.length}`;
            document.getElementById('final-time').innerText = `${minutes}m ${seconds}s`;
            
            const ratio = currentSession.length > 0 ? score / currentSession.length : 0;
            
            const comment = document.getElementById('comment');
            if (ratio >= 0.8) { comment.innerText = "Excellent ! 🏆"; comment.style.color = "#48bb78"; }
            else if (ratio >= 0.5) { comment.innerText = "Bien joué ! 👍"; comment.style.color = "#ed8936"; }
            else { comment.innerText = "Courage ! 💪"; comment.style.color = "#e53e3e"; }
            
            const contBtn = document.getElementById('continue-btn');
            const msg = document.getElementById('detail-msg');

            if (remainingQuestions.length > 0 && sessionSize !== Infinity) {
                contBtn.style.display = 'block';
                contBtn.innerText = `Continuer la suite`;
                msg.innerText = `📦 Il reste encore ${remainingQuestions.length} questions inédites dans ce module.`;
            } else {
                contBtn.style.display = 'none';
                msg.innerText = `🎉 Vous avez fait le tour de toutes les questions disponibles !`;
            }
        }
    </script>
